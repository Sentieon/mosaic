[pytest]
# Repo root, vcflib, and the tests dir on the import path so test modules can
# `import config` / `import aggregate` / `import ingest_multi_gvcfs` and the
# shared `import jc_testlib` helper without any sys.path juggling.
pythonpath = . vcflib tests
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: fast pure-function tests; no Docker stack required
    integration: needs the local Docker stack (Postgres + Iceberg REST + MinIO)
    restart: crash/resume correctness tests (a subset of integration; the priority)
    e2e: full pipeline end-to-end vs the vcfdiff baseline (Docker, slow)
