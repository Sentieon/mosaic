[package]
name = "mosaic-ingest-worker"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
publish = false

[dependencies]
anyhow = "1.0.104"
arrow = { version = "60", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
mosaic-core = { path = "../mosaic-core" }
memchr = "2.8.3"
noodles-bgzf = { version = "0.52.0", features = ["libdeflate"] }
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "brotli"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
